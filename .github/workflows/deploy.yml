name: Deploy para Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Conectar via SSH e Atualizar Servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Iniciando atualização automática no VPS..."
            cd /var/www/app-rafael
            git fetch origin main
            git reset --hard origin/main
            
            echo "📦 Instalando dependências e compilando Frontend Web..."
            cd web
            npm install
            npm run build
            
            echo "⚡ Atualizando Backend..."
            cd ../backend
            npm install
            
            echo "🔄 Recarregando processo no PM2..."
            pm2 reload mega12-sistema
            
            echo "✔ Deploy concluído com sucesso em https://grupomega.cloud"

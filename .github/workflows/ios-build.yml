name: Build & Validação do App iOS (iPhone)

on:
  push:
    paths:
      - 'ios_app/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'ios_app/**'
  workflow_dispatch:

jobs:
  build-ios:
    name: Compilar Mega 12 App (Xcode macOS)
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios_app

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Versão do Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Validar e Compilar Projeto iOS (Simulador iPhone 15)
        run: |
          xcodebuild clean build \
            -project Mega12App.xcodeproj \
            -scheme Mega12App \
            -destination "platform=iOS Simulator,name=iPhone 15,OS=latest" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Relatório de Sucesso
        run: |
          echo "🎉 Projeto iOS do Mega 12 compilado com 100% de sucesso!"
          echo "Pronto para deploy e assinatura no App Store Connect."

